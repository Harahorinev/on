name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install, test & build
        working-directory: backend
        run: |
          npm ci
          npm run test
          npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install, lint, test & build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      VITE_API_URL: http://localhost:3001
      PORT: 3001
      JWT_SECRET: ci-secret-for-testing
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Seed DB
        working-directory: backend
        run: npm run seed

      - name: Start backend
        working-directory: backend
        run: |
          node dist/index.js &
          sleep 3
          curl -sf http://127.0.0.1:3001/health

      - name: Install frontend & Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set -e
            cd /var/www/on || { echo "Directory /var/www/on not found"; exit 1; }
            SAVED=$(git rev-parse HEAD)
            trap 'cd /var/www/on && git reset --hard $SAVED && echo "Deploy failed, reverted to $SAVED"; exit 1' ERR
            git fetch origin main
            git reset --hard origin/main
            echo "Building at commit: $(git rev-parse --short HEAD)"
            cd backend && npm ci && npm run build
            pm2 restart on-backend || true
            cd ../frontend-auth && npm ci && npm run build
            cd ../frontend-user && npm ci && npm run build
            cd ../frontend-company && npm ci && npm run build
            cd ../frontend
            VITE_USE_MF=true VITE_REMOTE_AUTH_URL=https://och-net.ru/remote-auth VITE_REMOTE_USER_URL=https://och-net.ru/remote-user VITE_REMOTE_COMPANY_URL=https://och-net.ru/remote-company npm ci && npm run build
            cp -r ../frontend-auth/dist dist/remote-auth
            cp -r ../frontend-user/dist dist/remote-user
            cp -r ../frontend-company/dist dist/remote-company
            trap - ERR
            echo "Deploy finished."
